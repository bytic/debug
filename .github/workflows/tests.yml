name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            symfony: '^5.4'
            phpunit: '^9.6'
          - php: '8.1'
            symfony: '^5.4'
            phpunit: '^10.5'
          - php: '8.1'
            symfony: '^6.4'
            phpunit: '^10.5'
          - php: '8.2'
            symfony: '^7.0'
            phpunit: '^11.5'
          - php: '8.3'
            symfony: '^7.0'
            phpunit: '^12.0'
          - php: '8.4'
            symfony: '^8.0'
            phpunit: '^12.0'
          - php: '8.5'
            symfony: '^8.0'
            phpunit: '^12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Select compatible dependency versions
        run: >-
          composer require --no-update --no-interaction
          "symfony/error-handler:${{ matrix.symfony }}"
      - name: Select development dependencies
        run: >-
          composer require --dev --no-update --no-interaction
          "phpunit/phpunit:${{ matrix.phpunit }}"
          "symfony/config:${{ matrix.symfony }}"
          "symfony/dependency-injection:${{ matrix.symfony }}"
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer test
